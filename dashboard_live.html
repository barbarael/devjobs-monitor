<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevJobs Monitor – Real-time Dashboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap');
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'DM Sans', sans-serif;
            background: #0E0C0A;
            color: #E0DDD8;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            padding: 24px 28px;
            margin-bottom: 24px;
            backdrop-filter: blur(10px);
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        
        .logo-icon {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: linear-gradient(135deg, #C8A96E, #8B6914);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        
        .logo h1 {
            font-family: 'DM Serif Display', serif;
            font-size: 22px;
            color: #F0EDE6;
        }
        
        .logo p {
            font-size: 11px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-top: 2px;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }
        
        .stat-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 10px;
            padding: 16px 20px;
        }
        
        .stat-icon {
            font-size: 24px;
            margin-bottom: 8px;
        }
        
        .stat-value {
            font-size: 32px;
            font-weight: 800;
            font-family: 'DM Serif Display', serif;
            margin-bottom: 4px;
        }
        
        .stat-label {
            font-size: 11px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }
        
        .controls {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .scan-button {
            width: 100%;
            background: rgba(200,169,110,0.2);
            border: 1px solid rgba(200,169,110,0.4);
            border-radius: 8px;
            padding: 14px;
            color: #C8A96E;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s;
        }
        
        .scan-button:hover:not(:disabled) {
            background: rgba(200,169,110,0.3);
        }
        
        .scan-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .job-card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.07);
            border-left: 3px solid #C8A96E;
            border-radius: 10px;
            padding: 16px 20px;
            margin-bottom: 12px;
            transition: all 0.2s;
        }
        
        .job-card:hover {
            background: rgba(255,255,255,0.06);
            transform: translateX(4px);
        }
        
        .job-card.new {
            border-left-color: #FFD764;
            animation: pulseNew 2s ease-out;
        }
        
        @keyframes pulseNew {
            0% { box-shadow: 0 0 0 0 rgba(255,215,100,0.4); }
            70% { box-shadow: 0 0 0 10px rgba(255,215,100,0); }
            100% { box-shadow: 0 0 0 0 rgba(255,215,100,0); }
        }
        
        .job-header {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 10px;
        }
        
        .company-icon {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: rgba(200,169,110,0.15);
            border: 1px solid rgba(200,169,110,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 800;
            color: #C8A96E;
            flex-shrink: 0;
        }
        
        .job-content {
            flex: 1;
            min-width: 0;
        }
        
        .job-title {
            font-weight: 700;
            font-size: 15px;
            color: #F0EDE6;
            margin-bottom: 4px;
        }
        
        .job-company {
            color: #C8A96E;
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 8px;
        }
        
        .job-snippet {
            color: #9A9590;
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 10px;
        }
        
        .job-link {
            color: #C8A96E;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
        }
        
        .job-link:hover {
            color: #E0C080;
            text-decoration: underline;
        }
        
        .badge-new {
            background: #FFD764;
            color: #1a1208;
            border-radius: 4px;
            padding: 2px 8px;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-left: 8px;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }
        
        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        
        .status-msg {
            background: rgba(126,181,166,0.1);
            border: 1px solid rgba(126,181,166,0.25);
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 20px;
            color: #7EB5A6;
            font-size: 13px;
        }
        
        .timestamp {
            font-size: 11px;
            color: #555;
            text-align: right;
            margin-top: 20px;
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .spinner {
            display: inline-block;
            animation: spin 1s linear infinite;
        }
        
        .filter-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        
        .filter-btn {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 6px 14px;
            color: #888;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .filter-btn:hover {
            background: rgba(255,255,255,0.06);
        }
        
        .filter-btn.active {
            background: rgba(200,169,110,0.2);
            border-color: rgba(200,169,110,0.4);
            color: #C8A96E;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <div class="logo-icon">🏗</div>
                <div>
                    <h1>DevJobs Monitor</h1>
                    <p>Real Estate Marketing Jobs</p>
                </div>
            </div>
        </header>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-icon">📋</div>
                <div class="stat-value" style="color: #C8A96E;" id="totalJobs">—</div>
                <div class="stat-label">Celkem pozic</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🔔</div>
                <div class="stat-value" style="color: #FFD764;" id="newJobs">—</div>
                <div class="stat-label">Nových dnes</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🏢</div>
                <div class="stat-value" style="color: #7EB5A6;" id="companiesCount">—</div>
                <div class="stat-label">Sledovaných firem</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">⏰</div>
                <div class="stat-value" style="color: #B08EA2; font-size: 20px;" id="lastUpdate">—</div>
                <div class="stat-label">Poslední aktualizace</div>
            </div>
        </div>

        <div class="controls">
            <button class="scan-button" id="scanBtn" onclick="runScan()">
                <span id="scanIcon">🔍</span>
                <span id="scanText">Skenovat teď</span>
            </button>
        </div>

        <div id="statusContainer"></div>

        <div class="filter-buttons" id="filterButtons">
            <button class="filter-btn active" data-filter="all">Vše</button>
        </div>

        <div id="jobsContainer"></div>

        <div class="timestamp" id="timestamp"></div>
    </div>

    <script>
        let allJobs = [];
        let currentFilter = 'all';
        let seenJobIds = new Set();

        // Načti z localStorage, které inzeráty už byly viděné
        function loadSeenJobs() {
            const stored = localStorage.getItem('seenJobIds');
            if (stored) {
                seenJobIds = new Set(JSON.parse(stored));
            }
        }

        function saveSeenJobs() {
            localStorage.setItem('seenJobIds', JSON.stringify([...seenJobIds]));
        }

        function jobId(job) {
            return `${job.company}-${job.title}-${job.url}`.toLowerCase().replace(/\s+/g, '');
        }

        function isNewJob(job) {
            return !seenJobIds.has(jobId(job));
        }

        function markAsSeen(job) {
            seenJobIds.add(jobId(job));
            saveSeenJobs();
        }

        async function runScan() {
            const btn = document.getElementById('scanBtn');
            const icon = document.getElementById('scanIcon');
            const text = document.getElementById('scanText');
            const statusContainer = document.getElementById('statusContainer');

            btn.disabled = true;
            icon.innerHTML = '<span class="spinner">↻</span>';
            text.textContent = 'Skenuji...';

            statusContainer.innerHTML = '<div class="status-msg">🔍 Spouštím career_scan.py...</div>';

            try {
                // V reálném nasazení by tady bylo volání na backend/API
                // Pro lokální použití potřebuješ spustit career_scan.py manuálně
                // a pak načíst found_jobs.txt
                
                const response = await fetch('found_jobs.json');
                if (response.ok) {
                    const data = await response.json();
                    allJobs = data.jobs || [];
                    displayJobs();
                    statusContainer.innerHTML = `<div class="status-msg">✅ Nalezeno ${allJobs.length} pozic</div>`;
                } else {
                    throw new Error('Soubor nenalezen');
                }
            } catch (error) {
                statusContainer.innerHTML = `
                    <div class="status-msg" style="background: rgba(224,122,95,0.1); border-color: rgba(224,122,95,0.25); color: #E07A5F;">
                        ⚠️ Nepodařilo se načíst data. Ujisti se, že jsi spustil(a) <code>python career_scan.py</code> 
                        a že existuje soubor <code>found_jobs.json</code> ve stejné složce jako tento dashboard.
                    </div>
                `;
                
                // Pro ukázku načti demo data
                loadDemoData();
            }

            btn.disabled = false;
            icon.textContent = '🔍';
            text.textContent = 'Skenovat znovu';
        }

        function loadDemoData() {
            // Demo data pro ukázku
            allJobs = [
                {
                    title: "Senior Marketing Manager",
                    company: "CTP",
                    url: "https://www.ctp.eu/careers",
                    snippet: "Hledáme zkušeného Senior Marketing Managera pro strategické řízení marketingu v CEE regionu."
                },
                {
                    title: "Head of Marketing & Communication",
                    company: "Penta Real Estate",
                    url: "https://www.pentarealestate.com/cs/kariera",
                    snippet: "Vedení marketingu a komunikace pro nadnárodní skupinu."
                }
            ];
            displayJobs();
        }

        function displayJobs() {
            const container = document.getElementById('jobsContainer');
            const filterButtons = document.getElementById('filterButtons');
            
            // Aktualizuj statistiky
            document.getElementById('totalJobs').textContent = allJobs.length;
            const newCount = allJobs.filter(j => isNewJob(j)).length;
            document.getElementById('newJobs').textContent = newCount;
            
            const companies = [...new Set(allJobs.map(j => j.company))];
            document.getElementById('companiesCount').textContent = companies.length;
            document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString('cs-CZ', { hour: '2-digit', minute: '2-digit' });

            // Vytvoř filtrovací tlačítka
            filterButtons.innerHTML = '<button class="filter-btn active" data-filter="all" onclick="setFilter(\'all\')">Vše</button>';
            companies.forEach(company => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn';
                btn.dataset.filter = company;
                btn.textContent = company;
                btn.onclick = () => setFilter(company);
                filterButtons.appendChild(btn);
            });

            // Filtruj a zobraz inzeráty
            const filtered = currentFilter === 'all' 
                ? allJobs 
                : allJobs.filter(j => j.company === currentFilter);

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <div>Žádné pozice nenalezeny</div>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(job => {
                const isNew = isNewJob(job);
                const initial = job.company[0].toUpperCase();
                
                return `
                    <div class="job-card ${isNew ? 'new' : ''}">
                        <div class="job-header">
                            <div class="company-icon">${initial}</div>
                            <div class="job-content">
                                <div class="job-title">
                                    ${job.title}
                                    ${isNew ? '<span class="badge-new">NOVÉ</span>' : ''}
                                </div>
                                <div class="job-company">🏢 ${job.company}</div>
                                ${job.snippet ? `<div class="job-snippet">${job.snippet}</div>` : ''}
                                <a href="${job.url}" target="_blank" class="job-link" onclick="markJobAsSeen('${jobId(job)}')">
                                    Zobrazit inzerát →
                                </a>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('timestamp').textContent = 
                `Aktualizováno: ${new Date().toLocaleString('cs-CZ')}`;
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.filter === filter);
            });
            displayJobs();
        }

        function markJobAsSeen(id) {
            seenJobIds.add(id);
            saveSeenJobs();
        }

        // Automaticky načti data při otevření stránky
        window.addEventListener('load', () => {
            loadSeenJobs();
            runScan();
        });

        // Auto-refresh každých 5 minut
        setInterval(runScan, 5 * 60 * 1000);
    </script>
</body>
</html>
